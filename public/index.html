<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Juego Canvas</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
      .joystick-zone { display: none; position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); width: 150px; height: 150px; z-index: 10; }
      #move-zone { left: max(24px, env(safe-area-inset-left)); }
      #aim-zone { right: max(24px, env(safe-area-inset-right)); }
      body.mobile .joystick-zone { display: block; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="move-zone" class="joystick-zone" aria-label="Joystick de movimiento"></div>
    <div id="aim-zone" class="joystick-zone" aria-label="Joystick de apuntado"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/game.js"></script>
  </body>
</html>
